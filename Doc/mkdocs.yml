site_name: open5Gcube
copyright: "&copy; Fraunhofer FKIE"

site_dir: html
exclude_docs: |
  README.md
  html/
  mkdocs.yml

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Installation: installation.md
  - User Guide: user_guide.md
  - Stacks: stacks.md
  - Development: development.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer

extra_css:
  - css/neoteroi.css
  - css/extra.css

extra_javascript:
  - js/external_links.js

extra:
  generator: false

plugins:
  - search
  - offline
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - neoteroi.cards
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
