logger:
    file:
      path: /var/log/open5gs/smf.log
    level: ${OPEN5GS_LOGLEVEL}

global:
  max:
    ue: 1024
  parameter:
      no_ipv4v6_local_addr_in_packet_filter: true

smf:
    freeDiameter: /open5gs/install/etc/freeDiameter/smf.conf
    gtpc:
      server:
        - address: ${SMF_IP_ADDR}
    gtpu:
      server:
        - address: ${SMF_IP_ADDR}
    pfcp:
      server:
        - address: ${SMF_IP_ADDR}
      client:
        upf:
          - address: ${UPF_IP_ADDR}
    session:
      - subnet: ${UE_IP_SUBNET}
        gateway: ${UE_IP_GATEWAY}
        dnn: ${APN}
      - subnet: 2001:230:cafe::/48
        gateway: 2001:230:cafe::1
        dnn: ${APN}
      - subnet: ${UE_IMS_IP_SUBNET}
        gateway: ${UE_IMS_IP_GATEWAY}
        dnn: ims
      - subnet: 2001:230:babe::/48
        gateway: 2001:230:babe::1
        dnn: ims
    dns:
      - ${UE_DNS_SERVER1}
      - ${UE_DNS_SERVER2}
      - 2001:4860:4860::8888
      - 2001:4860:4860::8844
    p-cscf:
      - ${PCSCF_IP_ADDR}
    mtu: 1450
    metrics:
      server:
        - address: ${SMF_IP_ADDR}
          port: 9091
