logger:
    file:
      path: /var/log/open5gs/sepp.log
    level: ${OPEN5GS_LOGLEVEL}

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: 1024

sepp:
    sbi:
      server:
        - address: ${SEPP_IP_ADDR}
          port: 7777
      client:
        scp:
          - uri: http://${SCP_IP_ADDR}:7777
    n32:
      server:
        - sender: sepp.5gc.mnc${MNC03}.mcc${MCC}.3gppnetwork.org
      client:
        sepp:
          - receiver: sepp.5gc.mnc${SEPP_PEER_MNC03}.mcc${SEPP_PEER_MCC}.3gppnetwork.org
            uri: http://sepp.5gc.mnc${SEPP_PEER_MNC03}.mcc${SEPP_PEER_MCC}.3gppnetwork.org:7777
