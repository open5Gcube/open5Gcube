cu_cp:
  amf:
    addr: ${AMF_IP_ADDR}
    port: 38412
    bind_addr: ${GNB_IP_ADDR}
    supported_tracking_areas:
      - tac: ${TAC}
        plmn_list:
          - plmn: "${MCC}${MNC}"
            tai_slice_support_list:
              - sst: ${NSSAI_SST}
                sd: 0x${NSSAI_SD}
  security:
    integrity: not_needed
    confidentiality: required
    nea_pref_list: ${FIVEG_CIPHERING_ORDER}
    nia_pref_list: ${GNB_NIA_PREF_LIST}

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=64,num_send_frames=64
  srate: 23.04
  otw_format: sc12
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  dl_arfcn: ${NR_ARFCN}
  band: ${NR_BAND}
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "${MCC}${MNC}"
  tac: ${TAC}
  pci: 1

log:
  filename: stdout
  all_level: ${OCUDU_LOGLEVEL}

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
