cu_cp:
  amf:
    addrs: ${AMF_IP_ADDR}
    bind_addrs: ${CU_CP_IP_ADDR}
    supported_tracking_areas:
      - tac: ${TAC}
        plmn_list:
          - plmn: "${MCC}${MNC}"
            tai_slice_support_list:
              - sst: ${NSSAI_SST}
                sd: 0x${NSSAI_SD}
  security:
    integrity: not_needed
    confidentiality: required
    nea_pref_list: ${FIVEG_CIPHERING_ORDER}
    nia_pref_list: ${GNB_NIA_PREF_LIST}
  f1ap:
    bind_addrs: ${CU_CP_RAN_IP_ADDR}

cu_up:
  ngu:
    socket:
      - bind_addr: ${CU_UP_IP_ADDR}
  f1u:
    socket:
      - bind_addr: ${CU_UP_RAN_IP_ADDR}

log:
  filename: stdout
  all_level: ${OCUDU_LOGLEVEL}

pcap:
  ngap_enable: false
  ngap_filename: /tmp/cu_ngap.pcap
