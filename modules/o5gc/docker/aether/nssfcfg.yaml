info:
  version: 1.0.0
  description: NSSF configuration

configuration:
  nssfName: NSSF

  # nrfUri: URI of the Network Repository Function (NRF)
  nrfUri: http://${NRF_IP_ADDR}:7777

  # webuiUri: URI of the Web UI for subscriber data management.
  # Must be a valid http:// or https:// URI with a non-empty hostname.
  webuiUri: http://${AETHER_WEBUI_IP_ADDR}:5001

  # Service-based interface (SBI / HTTP) settings
  sbi:
    scheme: http
    registerIPv4: ${NSSF_IP_ADDR}
    bindingIPv4: ${NSSF_IP_ADDR}
    port: 7777

  serviceNameList:
    - nnssf-nsselection
    - nnssf-nssaiavailability

  # Network Slice Instance list — maps each S-NSSAI to one or more NSI NRF endpoints.
  # nrfId: full URI to the NRF NF management endpoint for this NSI
  # nsiId: opaque identifier for the Network Slice Instance (string)
  # An S-NSSAI with no sd field matches any slice of that sst.
  # Multiple nsiInformationList entries represent alternative NSIs for the same slice.
  nsiList:
    - snssai:
        sst: ${NSSAI_SST}
        sd: ${NSSAI_SD}
      nsiInformationList:
        - nrfId: http://${NRF_IP_ADDR}:7777/nnrf-nfm/v1/nf-instances
          nsiId: 22

logger:
  # NSSF service log level. Valid values: debug, info, warn, error, dpanic, panic, fatal
  NSSF:
    debugLevel: info
