# network functions of the home network
x-home-nf: &home-nf
  extends:
    service: home-base
  profiles: [ "core" ]

x-sbi-healthcheck: &sbi-healthcheck
  healthcheck:
    test: bash -c "ss -ltn | grep -q ':7777'"
    start_period: 5s
    start_interval: 1s
    interval: 10s
    timeout: 5s
    retries: 5

# network functions of the visited network
x-visited-nf: &visited-nf
  extends:
    service: visited-base
  profiles: [ "core" ]

# ---------------------------------------------------------------------
networks:
  # ---------------------------------------------------------------------
  home-corenet:
    driver: bridge
    name: home-corenet
    ipam:
      config:
        - subnet: ${HOME_CORENET_SUBNET}
          gateway: ${HOME_CORENET_HOST_IP_ADDR}
    driver_opts:
      com.docker.network.bridge.name: home-corenet
  home-extnet:
    driver: bridge
    name: home-extnet
    ipam:
      config:
        - subnet: ${HOME_EXTNET_SUBNET}
          gateway: ${HOME_EXTNET_HOST_IP_ADDR}
    driver_opts:
      com.docker.network.bridge.name: home-extnet

  # -----------------------------------------------------------------

  visited-corenet:
    driver: bridge
    name: visited-corenet
    ipam:
      config:
        - subnet: ${VISITED_CORENET_SUBNET}
          gateway: ${VISITED_CORENET_HOST_IP_ADDR}
    driver_opts:
      com.docker.network.bridge.name: visited-corenet
  visited-extnet:
    driver: bridge
    name: visited-extnet
    ipam:
      config:
        - subnet: ${VISITED_EXTNET_SUBNET}
          gateway: ${VISITED_EXTNET_HOST_IP_ADDR}
    driver_opts:
      com.docker.network.bridge.name: visited-extnet

# ---------------------------------------------------------------------
services:
  # ---------------------------------------------------------------------
  # The UE of the home network attaches to the gNB of the visited network
  gnb-ue:
    extends:
      file: ${DOCKER}/packetrusher/services.yaml
      service: gnb-ue
    environment:
      - GNB_IP_ADDR=${VISITED_GNB_IP_ADDR}
      - GNB_MCC=${VISITED_MCC}
      - GNB_MNC=${VISITED_MNC}
      - UE_MCC=${HOME_MCC}
      - UE_MNC=${HOME_MNC}
      - AMF_IP_ADDR=visited-amf
    networks: !override
      visited-corenet:
        ipv4_address: ${VISITED_GNB_IP_ADDR}

  # -----------------------------------------------------------------
  # The network functions use the default configurations of
  # docker/open5gs, filled in with the PLMN and addresses of their network.
  # The SBI network functions listen on and reach each other by their FQDN,
  # which their network aliases resolve: the SEPPs route the requests of the
  # other network by the FQDN in the NF profiles. Diameter, PFCP and GTP-U
  # need IP addresses, so SMF, UPF and PCRF have static ones.

  home-base:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: base
    environment:
      - OPEN5GS_INIT_HOST=home-open5gs-init
      - DB_URI=mongodb://home-mongo/open5gs
      - MONGO_IP_ADDR=home-mongo
      - MCC=${HOME_MCC}
      - MNC=${HOME_MNC}
      - MNC03=${HOME_MNC03}
      - NRF_IP_ADDR=nrf.5gc.${HOME_PLMN_DOMAIN}
      - SCP_IP_ADDR=scp.5gc.${HOME_PLMN_DOMAIN}
      - AUSF_IP_ADDR=ausf.5gc.${HOME_PLMN_DOMAIN}
      - UDM_IP_ADDR=udm.5gc.${HOME_PLMN_DOMAIN}
      - UDR_IP_ADDR=udr.5gc.${HOME_PLMN_DOMAIN}
      - PCF_IP_ADDR=pcf.5gc.${HOME_PLMN_DOMAIN}
      - BSF_IP_ADDR=bsf.5gc.${HOME_PLMN_DOMAIN}
      - NSSF_IP_ADDR=nssf.5gc.${HOME_PLMN_DOMAIN}
      - AMF_IP_ADDR=amf.5gc.${HOME_PLMN_DOMAIN}
      - SEPP_IP_ADDR=sepp.5gc.${HOME_PLMN_DOMAIN}
      - SMF_IP_ADDR=${HOME_SMF_IP_ADDR}
      - UPF_IP_ADDR=${HOME_UPF_IP_ADDR}
      - UPF_ADVERTISE_IP=${HOME_UPF_IP_ADDR}
      - PCRF_IP_ADDR=${HOME_PCRF_IP_ADDR}
      - EPC_DOMAIN=epc.${HOME_PLMN_DOMAIN}
      - IMS_DOMAIN=ims.${HOME_PLMN_DOMAIN}
    domainname: 5gc.${HOME_PLMN_DOMAIN}
    networks:
      - home-corenet

  home-mongo:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: mongo
    container_name: home-mongo
    networks: !override
      - home-corenet

  home-open5gs-webui:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: open5gs-webui
    container_name: home-open5gs-webui
    environment:
      - DB_URI=mongodb://home-mongo/open5gs
      - MONGO_IP_ADDR=home-mongo
    networks: !override
      home-corenet:
      o5gc:
        gw_priority: 1
    ports: !override
      - ${O5GC_WEBUI_HOST_ADDR}:${HOME_OPEN5GS_WEBUI_HOST_PORT}:3000
    labels:
      o5gc.link.title: "Home Open5GS WebUI"
      o5gc.link.url: "http://{{host}}:${HOME_OPEN5GS_WEBUI_HOST_PORT}/"
    depends_on: !override [ home-mongo ]

  home-open5gs-init:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: open5gs-init
    container_name: home-open5gs-init
    environment:
      - OPEN5GS_WEBUI_IP_ADDR=home-open5gs-webui
      - MONGO_IP_ADDR=home-mongo
      - MCC=${HOME_MCC}
      - MNC=${HOME_MNC}
    networks: !override
      - home-corenet
    depends_on: !override [ home-open5gs-webui ]

  home-nrf:
    <<: [ *home-nf, *sbi-healthcheck ]
    container_name: home-nrf
    command: nrf
    networks: { home-corenet: { aliases: [ "nrf.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-scp:
    <<: [ *home-nf, *sbi-healthcheck ]
    container_name: home-scp
    command: scp
    networks: { home-corenet: { aliases: [ "scp.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-ausf:
    <<: *home-nf
    container_name: home-ausf
    command: ausf
    networks: { home-corenet: { aliases: [ "ausf.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-udm:
    <<: *home-nf
    container_name: home-udm
    command: udm
    networks: { home-corenet: { aliases: [ "udm.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-udr:
    <<: *home-nf
    container_name: home-udr
    command: udr
    networks: { home-corenet: { aliases: [ "udr.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-pcf:
    <<: *home-nf
    container_name: home-pcf
    command: pcf
    networks: { home-corenet: { aliases: [ "pcf.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-bsf:
    <<: *home-nf
    container_name: home-bsf
    command: bsf
    networks: { home-corenet: { aliases: [ "bsf.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-nssf:
    <<: *home-nf
    container_name: home-nssf
    command: nssf
    networks: { home-corenet: { aliases: [ "nssf.5gc.${HOME_PLMN_DOMAIN}" ] } }

  home-amf:
    <<: *home-nf
    container_name: home-amf
    command: amf
    networks: { home-corenet: { aliases: [ "amf.5gc.${HOME_PLMN_DOMAIN}" ] } }
    labels:
      o5gc.webui.priority: ${WEBUI_PRIO_CORE_HIGH}

  home-smf:
    <<: *home-nf
    container_name: home-smf
    command: smf
    networks: { home-corenet: { ipv4_address: "${HOME_SMF_IP_ADDR}" } }
    labels:
      o5gc.webui.priority: ${WEBUI_PRIO_CORE_HIGH}

  home-upf:
    <<: *home-nf
    container_name: home-upf
    command: upf
    privileged: true
    environment:
      - CAPTURE_INTERFACE=ogstun
    networks:
      home-corenet:
        ipv4_address: ${HOME_UPF_IP_ADDR}
      home-extnet:
        gw_priority: 1
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1

  home-pcrf:
    <<: *home-nf
    container_name: home-pcrf
    command: pcrf
    networks: { home-corenet: { ipv4_address: "${HOME_PCRF_IP_ADDR}" } }

  home-sepp:
    <<: *home-nf
    container_name: home-sepp
    command: sepp
    environment:
      - SEPP_PEER_MCC=${VISITED_MCC}
      - SEPP_PEER_MNC03=${VISITED_MNC03}
    networks:
      home-corenet:
        aliases: [ "sepp.5gc.${HOME_PLMN_DOMAIN}" ]
      visited-corenet:
    # The SEPP starts the handshake with its peer only after it registered at
    # the NRF, and aborts when the peer's handshake comes first (Open5GS
    # v2.8.0): start it once it can register right away
    depends_on:
      home-nrf:
        condition: service_healthy
      home-scp:
        condition: service_healthy

  # -----------------------------------------------------------------

  visited-base:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: base
    environment:
      - OPEN5GS_INIT_HOST=visited-open5gs-init
      - DB_URI=mongodb://visited-mongo/open5gs
      - MONGO_IP_ADDR=visited-mongo
      - MCC=${VISITED_MCC}
      - MNC=${VISITED_MNC}
      - MNC03=${VISITED_MNC03}
      - NRF_IP_ADDR=nrf.5gc.${VISITED_PLMN_DOMAIN}
      - SCP_IP_ADDR=scp.5gc.${VISITED_PLMN_DOMAIN}
      - AUSF_IP_ADDR=ausf.5gc.${VISITED_PLMN_DOMAIN}
      - UDM_IP_ADDR=udm.5gc.${VISITED_PLMN_DOMAIN}
      - UDR_IP_ADDR=udr.5gc.${VISITED_PLMN_DOMAIN}
      - PCF_IP_ADDR=pcf.5gc.${VISITED_PLMN_DOMAIN}
      - BSF_IP_ADDR=bsf.5gc.${VISITED_PLMN_DOMAIN}
      - NSSF_IP_ADDR=nssf.5gc.${VISITED_PLMN_DOMAIN}
      - AMF_IP_ADDR=amf.5gc.${VISITED_PLMN_DOMAIN}
      - SEPP_IP_ADDR=sepp.5gc.${VISITED_PLMN_DOMAIN}
      - SMF_IP_ADDR=${VISITED_SMF_IP_ADDR}
      - UPF_IP_ADDR=${VISITED_UPF_IP_ADDR}
      - UPF_ADVERTISE_IP=${VISITED_UPF_IP_ADDR}
      - PCRF_IP_ADDR=${VISITED_PCRF_IP_ADDR}
      - EPC_DOMAIN=epc.${VISITED_PLMN_DOMAIN}
      - IMS_DOMAIN=ims.${VISITED_PLMN_DOMAIN}
    domainname: 5gc.${VISITED_PLMN_DOMAIN}
    networks:
      - visited-corenet

  visited-mongo:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: mongo
    container_name: visited-mongo
    networks: !override
      - visited-corenet

  visited-open5gs-webui:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: open5gs-webui
    container_name: visited-open5gs-webui
    environment:
      - DB_URI=mongodb://visited-mongo/open5gs
      - MONGO_IP_ADDR=visited-mongo
    networks: !override
      visited-corenet:
      o5gc:
        gw_priority: 1
    ports: !override
      - ${O5GC_WEBUI_HOST_ADDR}:${VISITED_OPEN5GS_WEBUI_HOST_PORT}:3000
    labels:
      o5gc.link.title: "Visited Open5GS WebUI"
      o5gc.link.url: "http://{{host}}:${VISITED_OPEN5GS_WEBUI_HOST_PORT}/"
    depends_on: !override [ visited-mongo ]

  visited-open5gs-init:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: open5gs-init
    container_name: visited-open5gs-init
    environment:
      - OPEN5GS_WEBUI_IP_ADDR=visited-open5gs-webui
      - MONGO_IP_ADDR=visited-mongo
      - MCC=${VISITED_MCC}
      - MNC=${VISITED_MNC}
    networks: !override
      - visited-corenet
    depends_on: !override [ visited-open5gs-webui ]

  visited-nrf:
    <<: [ *visited-nf, *sbi-healthcheck ]
    container_name: visited-nrf
    command: nrf
    networks: { visited-corenet: { aliases: [ "nrf.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-scp:
    <<: [ *visited-nf, *sbi-healthcheck ]
    container_name: visited-scp
    command: scp
    networks: { visited-corenet: { aliases: [ "scp.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-ausf:
    <<: *visited-nf
    container_name: visited-ausf
    command: ausf
    networks: { visited-corenet: { aliases: [ "ausf.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-udm:
    <<: *visited-nf
    container_name: visited-udm
    command: udm
    networks: { visited-corenet: { aliases: [ "udm.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-udr:
    <<: *visited-nf
    container_name: visited-udr
    command: udr
    networks: { visited-corenet: { aliases: [ "udr.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-pcf:
    <<: *visited-nf
    container_name: visited-pcf
    command: pcf
    volumes:
      - ./pcf-visited.yaml:/mnt/open5gs/pcf.yaml:ro
    networks: { visited-corenet: { aliases: [ "pcf.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-bsf:
    <<: *visited-nf
    container_name: visited-bsf
    command: bsf
    networks: { visited-corenet: { aliases: [ "bsf.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-nssf:
    <<: *visited-nf
    container_name: visited-nssf
    command: nssf
    networks: { visited-corenet: { aliases: [ "nssf.5gc.${VISITED_PLMN_DOMAIN}" ] } }

  visited-amf:
    <<: *visited-nf
    container_name: visited-amf
    command: amf
    networks: { visited-corenet: { aliases: [ "amf.5gc.${VISITED_PLMN_DOMAIN}" ] } }
    labels:
      o5gc.webui.priority: ${WEBUI_PRIO_CORE_HIGH}

  visited-smf:
    <<: *visited-nf
    container_name: visited-smf
    command: smf
    networks: { visited-corenet: { ipv4_address: "${VISITED_SMF_IP_ADDR}" } }
    labels:
      o5gc.webui.priority: ${WEBUI_PRIO_CORE_HIGH}

  visited-upf:
    <<: *visited-nf
    container_name: visited-upf
    command: upf
    privileged: true
    environment:
      - CAPTURE_INTERFACE=ogstun
    networks:
      visited-corenet:
        ipv4_address: ${VISITED_UPF_IP_ADDR}
      visited-extnet:
        gw_priority: 1
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1

  visited-pcrf:
    <<: *visited-nf
    container_name: visited-pcrf
    command: pcrf
    networks: { visited-corenet: { ipv4_address: "${VISITED_PCRF_IP_ADDR}" } }

  visited-sepp:
    <<: *visited-nf
    container_name: visited-sepp
    command: sepp
    environment:
      - SEPP_PEER_MCC=${HOME_MCC}
      - SEPP_PEER_MNC03=${HOME_MNC03}
    networks:
      visited-corenet:
        aliases: [ "sepp.5gc.${VISITED_PLMN_DOMAIN}" ]
      home-corenet:
    # The SEPP starts the handshake with its peer only after it registered at
    # the NRF, and aborts when the peer's handshake comes first (Open5GS
    # v2.8.0): start it once it can register right away
    depends_on:
      visited-nrf:
        condition: service_healthy
      visited-scp:
        condition: service_healthy
