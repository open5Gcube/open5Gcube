db_uri: ${DB_URI}

logger:
    file:
      path: /var/log/open5gs/pcf.log
    level: ${OPEN5GS_LOGLEVEL}

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: 1024

pcf:
    sbi:
      server:
        - address: ${PCF_IP_ADDR}
          port: 7777
      client:
        nrf:
          - uri: http://${NRF_IP_ADDR}:7777
        scp:
          - uri: http://${SCP_IP_ADDR}:7777
    # the visited network has no subscription data of the roaming UEs: the
    # policy for their locally broken out sessions
    policy:
      - plmn_id:
          mcc: ${HOME_MCC}
          mnc: ${HOME_MNC}
        slice:
          - sst: ${NSSAI_SST}
            sd: ${NSSAI_SD}
            default_indicator: true
            session:
              - name: ${APN}
                type: 3  # 1:IPv4, 2:IPv6, 3:IPv4v6
                ambr:
                  downlink:
                    value: 1
                    unit: 3  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                  uplink:
                    value: 1
                    unit: 3
                qos:
                  index: 9
                  arp:
                    priority_level: 8
                    pre_emption_vulnerability: 1  # 1: Disabled, 2:Enabled
                    pre_emption_capability: 1  # 1: Disabled, 2:Enabled
    metrics:
      server:
        - address: ${PCF_IP_ADDR}
          port: 9091
