services:
  mysql:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: mysql

  amf:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: amf
    volumes:
      - ./cn5g.yaml:/mnt/oai/cn5g.yaml:ro
    depends_on: !override
      mysql:
        condition: service_healthy

  smf:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: smf
    volumes:
      - ./cn5g.yaml:/mnt/oai/cn5g.yaml:ro
    depends_on: !override
      amf:
        condition: service_healthy

  upf:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: upf
    volumes:
      - ./cn5g.yaml:/mnt/oai/cn5g.yaml:ro
    depends_on: !override []

  gnb:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: gnb

  ue:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: ue
