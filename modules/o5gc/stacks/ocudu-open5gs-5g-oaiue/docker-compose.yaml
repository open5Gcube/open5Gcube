services:
  gnb:
    extends:
      file: ${DOCKER}/ocudu/services.yaml
      service: gnb
    volumes:
      - ./gnb-zmq.yaml:/mnt/stack/gnb.yaml:ro
    networks: !override
      ran:
        ipv4_address: ${GNB_RAN_IP_ADDR}
      corenet:
        ipv4_address: ${GNB_IP_ADDR}

  ue:
    extends:
      file: ${DOCKER}/oai/services.yaml
      service: ue
    # 51 PRB / 20 MHz at 30 kHz SCS with 3/4 sampling (-E) matches the gNB's 23.04 MHz srate
    command: >-
      nr-ue -r 51 --numerology 1 --band ${NR_BAND}
      -C $(scripts/band_helper.py arfcn_to_freq ${NR_ARFCN}) -E --ue-scan-carrier
      --uecap_file targets/PROJECTS/GENERIC-NR-5GC/CONF/uecap_ports1.xml
      --device.name oai_zmqdevif
      --zmq.[0].tx_channels tcp://${UE_RAN_IP_ADDR}:2001
      --zmq.[0].rx_channels tcp://${GNB_RAN_IP_ADDR}:2000

  mongo:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: mongo
  mongo-express:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: mongo-express

  open5gs-webui:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: open5gs-webui

  open5gs-init:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: open5gs-init

  nrf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: nrf

  ausf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: ausf

  udr:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: udr

  udm:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: udm

  pcf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: pcf

  bsf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: bsf

  nssf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: nssf

  smf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: smf

  upf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: upf

  amf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: amf

  pcrf:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: pcrf
    depends_on: [ mongo ]

  scp:
    extends:
      file: ${DOCKER}/open5gs/services.yaml
      service: scp
