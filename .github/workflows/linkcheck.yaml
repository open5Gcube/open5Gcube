name: linkcheck

on:
  push:
    paths:
      - '**.md'
      - Makefile
      - .github/workflows/linkcheck.yaml
  pull_request:
    paths:
      - '**.md'
      - Makefile
      - .github/workflows/linkcheck.yaml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Check links
        run: make linkcheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
